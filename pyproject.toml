[project]
name = "friday"
version = "0.0.0"
description = "Local-first voice and text assistant for one Arch + Hyprland machine"
# Pinned to 3.12: Kokoro's phonemizer stack (misaki/espeak-ng/spacy) needs
# 3.10-3.12, and the system interpreter is 3.14. See ADR-016.
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "openwakeword>=0.4.0",
    "pywebrtc-audio>=0.1.0",
    "sherpa-onnx>=1.13.6",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "textual>=8.2.8",
    "webrtcvad-wheels>=2.0.14",
]

[tool.uv]
# Application, not a distributable package — no build backend, no src module
# required yet. Runtime deps are added per gate (llama client at G1, etc.).
package = false

[dependency-groups]
# Dev-only. The G2 harness itself uses the stdlib only — no runtime dep.
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
